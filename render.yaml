services:
  - type: web
    name: soundshare-safari
    runtime: docker
    plan: free
    region: singapore
    branch: feature/safari-web-deploy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FLUTTER_WEB
        value: 'true'
      - key: KEEP_ALIVE_ENABLED
        value: 'false'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CLERK_AUDIENCE
        value: soundshare-api
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
